name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Executar o terraform apply ?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  id-token: write
  contents: read


jobs:
  job1:
    name: Terraform CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: "Configura AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with: 
          role-to-assume: arn:aws:iam::922806890269:role/labaws
          aws-region: sa-east-1
        
      - name: HashiCorp - Setup Terraform
        uses: Hashicorp/setup-terraform@v2.0.3

      - name: Terraform Init
        run: terraform Init
        working-directory: ./terraform

      - name: Terraform Validade
        run: terraform validade

      - name: Terraform Plan
        run: terraform plan -out=tfplan.tfout 
        working-directory: ./terraform

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan.tfout
        if: github.event.inputs.apply == 'true'
        working-directory: ./terraform